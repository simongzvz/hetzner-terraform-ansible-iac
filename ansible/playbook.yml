---
- name: Server-Härtung & Docker-Setup (Cloud IaC)
  hosts: webservers
  become: true

  vars:
    admin_user: simon

  tasks:
    - name: APT-Cache aktualisieren und System-Pakete upgraden
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Basis-Tools und Sicherheits-Pakete installieren
      apt:
        name:
          - ufw
          - fail2ban
          - curl
          - ca-certificates
          - gnupg
        state: present

    - name: Admin-Benutzer anlegen und in sudo-Gruppe aufnehmen
      user:
        name: "{{ admin_user }}"
        groups: sudo
        shell: /bin/bash
        create_home: yes
        append: yes

    - name: Passwordless sudo für Admin-Benutzer erlauben
      copy:
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ admin_user }}"
        mode: '0440'

    - name: SSH-Key von root für Admin-Benutzer übernehmen
      authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: SSH-Root-Login deaktivieren
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

    - name: SSH-Passwort-Authentifizierung deaktivieren
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

    - name: UFW Standard-Regeln setzen und Ports öffnen
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '22'
        - '80'
        - '443'

    - name: UFW Firewall aktivieren
      ufw:
        state: enabled
        policy: deny

    - name: Fail2ban Dienst aktivieren und starten
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: Offiziellen Docker GPG-Key hinzufügen
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Offizielles Docker APT-Repository einbinden
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Docker Engine und Docker Compose Plugin installieren
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Admin-Benutzer zur docker-Gruppe hinzufügen
      user:
        name: "{{ admin_user }}"
        groups: docker
        append: yes

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
